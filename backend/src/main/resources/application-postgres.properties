# 실제 Postgres 연결 프로필 — --spring.profiles.active=postgres (또는 SPRING_PROFILES_ACTIVE=postgres)로 켠다.
# db/schema.sql을 먼저 psql로 수동 적용해둬야 한다 (DDL은 거기가 기준이고, 여기선 검증만 한다).

# stringtype=unspecified: every entity maps its enums with plain @Enumerated(STRING) against
# schema.sql's native Postgres ENUM columns. Without this, the driver binds enum params as
# VARCHAR and every insert/update fails ("column is of type x_status but expression is of
# type character varying"). This lets Postgres cast the untyped string implicitly instead.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservehub?stringtype=unspecified}
spring.datasource.username=${DB_USERNAME:reservehub}
spring.datasource.password=${DB_PASSWORD:reservehub}
spring.datasource.driver-class-name=org.postgresql.Driver

# db/schema.sql is the source of truth for DDL; Hibernate only validates it matches.
# db/schema.sql이 DDL의 기준이며, Hibernate는 일치 여부만 검증한다.
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false

# H2(기본 프로필)는 globally_quoted_identifiers=true로 Hibernate가 스스로 만드는 스키마라
# 어떤 이름을 쓰든 자체 일관되게 맞아떨어진다. 실 Postgres는 schema.sql이 기준이라, 이 설정이
# 켜져 있으면 camelCase 필드명(actorId 등)이 snake_case로 변환되지 않고 그대로 비교돼
# "missing column [actorId]"로 검증이 깨진다 — 여기서는 꺼서 기본 네이밍 전략이 정상 동작하게 한다.
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
