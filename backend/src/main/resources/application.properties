spring.application.name=ReserveHub

spring.main.banner-mode=off
spring.main.log-startup-info=false

# Postgres 연결. 실제 비밀번호는 커밋되는 이 파일에 적지 말고 DB_URL/DB_USERNAME/DB_PASSWORD
# 환경변수로 넘긴다 (없으면 ':' 뒤 로컬 기본값 사용). db/schema.sql을 먼저 psql로 적용해둬야 한다.
# stringtype=unspecified: 엔티티 enum(@Enumerated STRING)이 schema.sql의 Postgres ENUM 컬럼에
# 바인딩될 때 VARCHAR로 넘어가 insert/update가 실패하는 것을 막는다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservehub?stringtype=unspecified}
spring.datasource.username=${DB_USERNAME:reservehub}
spring.datasource.password=${DB_PASSWORD:reservehub}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false

# db/schema.sql이 DDL의 기준이며, Hibernate는 일치 여부만 검증한다.
spring.jpa.hibernate.ddl-auto=validate

# camelCase 필드가 snake_case 컬럼으로 변환되도록 꺼둔다 (켜면 "missing column [actorId]"로 검증 실패).
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# Auth is stateless JWT bearer-token based — no server-side session exists, so nothing here
# configures a session cookie. Rotate this secret (and prefer a long random value) for real deployments.
security.jwt.secret=${JWT_SECRET:reservehub-local-dev-secret-key-change-me-1234567890}
security.jwt.access-token-expiration=PT12H

# 재무 요청 댓글 첨부파일 — 로컬 디스크 저장(uploads/financial-requests/{requestId}/).
# ponytail: 첨부가 많아지면 S3 등으로 옮기는 게 맞지만, 지금은 단일 서버 로컬 디스크로 충분.
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
