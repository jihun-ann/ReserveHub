spring.application.name=ReserveHub

spring.main.banner-mode=off
spring.main.log-startup-info=false

# stringtype=unspecified: every entity maps its enums with plain @Enumerated(STRING) against
# schema.sql's native Postgres ENUM columns. Without this, the driver binds enum params as
# VARCHAR and every insert/update fails ("column is of type x_status but expression is of
# type character varying"). This lets Postgres cast the untyped string implicitly instead.
#spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservehub?stringtype=unspecified}
#spring.datasource.username=${DB_USERNAME:reservehub}
#spring.datasource.password=${DB_PASSWORD:reservehub}

spring.datasource.url=jdbc:h2:mem:reservehub;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# db/schema.sql is the source of truth for DDL; Hibernate only validates it matches.
# db/schema.sql이 DDL의 기준이며, Hibernate는 일치 여부만 검증한다.
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Auth is stateless JWT bearer-token based — no server-side session exists, so nothing here
# configures a session cookie. Rotate this secret (and prefer a long random value) for real deployments.
security.jwt.secret=${JWT_SECRET:reservehub-local-dev-secret-key-change-me-1234567890}
security.jwt.access-token-expiration=PT12H

# 재무 요청 댓글 첨부파일 — 로컬 디스크 저장(uploads/financial-requests/{requestId}/).
# ponytail: 첨부가 많아지면 S3 등으로 옮기는 게 맞지만, 지금은 단일 서버 로컬 디스크로 충분.
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
