spring.application.name=ReserveHub

spring.main.banner-mode=off
spring.main.log-startup-info=false

# 기본은 H2 인메모리 — 실제 Postgres에 붙이려면 application-postgres.properties 프로필을 켠다
# (--spring.profiles.active=postgres 또는 SPRING_PROFILES_ACTIVE=postgres). DB 접속 정보는 거기,
# DB_URL/DB_USERNAME/DB_PASSWORD 환경변수로 넘긴다 — 이 파일처럼 커밋되는 곳엔 실제 비밀번호를 적지 않는다.
spring.datasource.url=jdbc:h2:mem:reservehub;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Auth is stateless JWT bearer-token based — no server-side session exists, so nothing here
# configures a session cookie. Rotate this secret (and prefer a long random value) for real deployments.
security.jwt.secret=${JWT_SECRET:reservehub-local-dev-secret-key-change-me-1234567890}
security.jwt.access-token-expiration=PT12H

# 재무 요청 댓글 첨부파일 — 로컬 디스크 저장(uploads/financial-requests/{requestId}/).
# ponytail: 첨부가 많아지면 S3 등으로 옮기는 게 맞지만, 지금은 단일 서버 로컬 디스크로 충분.
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
