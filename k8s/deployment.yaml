apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservehub
spec:
  replicas: 1

  selector:
    matchLabels:
      app: reservehub

  template:
    metadata:
      labels:
        app: reservehub

    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: reservehub
          image: ghcr.io/jihun-ann/reservehub:dc81413c0ce73af3e25c499ecb2284e52f3027f6

          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: reservehub
spec:
  selector:
    app: reservehub

  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort