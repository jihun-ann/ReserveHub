apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservehub
spec:
  replicas: 1

  selector:
    matchLabels:
      app: reservehub

  template:
    metadata:
      labels:
        app: reservehub

    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: reservehub
          image: ghcr.io/jihun-ann/reservehub:82621b0295efa17463c7b0dc4e50e1c1a4dcceaa

          # DB 접속 정보는 secret.yaml(reservehub-db)에서 키로 꺼내 쓴다.
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: reservehub-db
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: reservehub-db
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservehub-db
                  key: DB_PASSWORD
            # 로그인 토큰 서명 키 — reservehub-jwt 시크릿에서 꺼낸다(없으면 코드의 공개된 기본값을 쓰게 되어 위험).
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: reservehub-jwt
                  key: JWT_SECRET
            # 서비스 운영자(플랫폼 개설 심사) 계정 — reservehub-admin 시크릿이 있으면 기동 시 한 번 만든다.
            # 시크릿이 없어도 파드는 뜬다(optional) — 그땐 운영자 계정만 안 생긴다.
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: reservehub-admin
                  key: ADMIN_USERNAME
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservehub-admin
                  key: ADMIN_PASSWORD
                  optional: true

          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: reservehub
spec:
  selector:
    app: reservehub

  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort