apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservehub
spec:
  replicas: 1

  selector:
    matchLabels:
      app: reservehub

  template:
    metadata:
      labels:
        app: reservehub

    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: reservehub
          image: ghcr.io/jihun-ann/reservehub:193a3e3d5c2bd9c32a6022d41fb808a791348a28

          # DB 접속 정보는 secret.yaml(reservehub-db)에서 키로 꺼내 쓴다.
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: reservehub-db
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: reservehub-db
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservehub-db
                  key: DB_PASSWORD
            # 로그인 토큰 서명 키 — reservehub-jwt 시크릿에서 꺼낸다(없으면 코드의 공개된 기본값을 쓰게 되어 위험).
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: reservehub-jwt
                  key: JWT_SECRET

          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: reservehub
spec:
  selector:
    app: reservehub

  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort