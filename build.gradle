plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.cloud.tools.jib' version '3.5.4'
    id 'org.siouan.frontend-jdk17' version '10.0.0'
}

group = 'com.hub'
version = '0.0.1-SNAPSHOT'
description = 'ReserveHub'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // OutboxEvent maps payload/headers as native JSON columns (@JdbcTypeCode(SqlTypes.JSON)) so
    // Postgres stores them as JSONB per db/schema.sql. Hibernate's automatic JsonFormatMapper only
    // auto-detects classic Jackson 2 (com.fasterxml.jackson.databind.ObjectMapper) — the app's own
    // JSON serialization elsewhere uses Jackson 3 (tools.jackson), which doesn't satisfy that probe.
    // jjwt-jackson (below) also depends on this, but it's kept explicit rather than relied on transitively.
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // Stateless bearer-token (JWT) authentication.
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            srcDirs = ['backend/src/main/java']
        }
        resources {
            srcDirs = ['backend/src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['backend/src/test/java']
        }
        resources {
            srcDirs = ['backend/src/test/resources']
        }
    }
}

jib {
    from {
        image = 'eclipse-temurin:17-jre'
    }

    container {
        ports = ['8080']
    }
}

frontend {
    nodeVersion = '22.23.3'
    packageJsonDirectory = file('frontend')
    assembleScript = 'run build'
}

tasks.named('processResources') {
    dependsOn tasks.named('assembleFrontend')
    from('frontend/dist') { into 'static' }
}
