plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hub'
version = '0.0.1-SNAPSHOT'
description = 'ReserveHub'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // OutboxEvent maps payload/headers as native JSON columns (@JdbcTypeCode(SqlTypes.JSON)) so
    // Postgres stores them as JSONB per db/schema.sql. Hibernate's automatic JsonFormatMapper only
    // auto-detects classic Jackson 2 (com.fasterxml.jackson.databind.ObjectMapper) — the app's own
    // JSON serialization elsewhere uses Jackson 3 (tools.jackson), which doesn't satisfy that probe,
    // so this stays even though nothing here calls it directly. It used to ride along transitively
    // via jjwt-jackson; keep it explicit now that JWT is gone.
    // OutboxEvent가 payload/headers를 네이티브 JSON 컬럼으로 매핑해서(@JdbcTypeCode(SqlTypes.JSON))
    // Postgres에 JSONB로 저장된다(db/schema.sql). Hibernate의 자동 JsonFormatMapper 감지는 클래식
    // Jackson 2(com.fasterxml.jackson.databind.ObjectMapper)만 인식하는데, 앱 자체 JSON 직렬화는
    // 다른 곳에서 Jackson 3(tools.jackson)를 쓰므로 이 감지를 만족시키지 못한다 — 예전엔
    // jjwt-jackson을 통해 딸려 들어왔던 것을, JWT 제거 이후로는 명시적으로 남겨둔다.
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            srcDirs = ['backend/src/main/java']
        }
        resources {
            srcDirs = ['backend/src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['backend/src/test/java']
        }
        resources {
            srcDirs = ['backend/src/test/resources']
        }
    }
}
