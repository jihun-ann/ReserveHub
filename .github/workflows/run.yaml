name: ReserveHub CI

on:
  push:
    branches:
      - sub-branch

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build and Push
    runs-on: k8s-runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Docker Login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      # Runner에서 GitHub 및 BellSoft JRE 다운로드가 가능한지 확인
      - name: Network Check
        run: |
          echo "=== GitHub connectivity ==="
          curl -I -L --connect-timeout 10 https://github.com

          echo "=== BellSoft JRE connectivity ==="
          curl -I -L --connect-timeout 10 \
            "https://github.com/bell-sw/Liberica/releases/download/17.0.20%2B10/bellsoft-jre17.0.20%2B10-linux-amd64.tar.gz"

      - name: Build Application Image
        run: |
          ./gradlew bootBuildImage \
            --imageName=ghcr.io/${{ github.repository_owner }}/reservehub:${{ github.sha }} \
            --info

      - name: Docker Push
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/reservehub:${{ github.sha }}

      - name: Update Kubernetes Image
        run: |
          sed -i \
            "s|image: ghcr.io/.*/reservehub:.*|image: ghcr.io/${{ github.repository_owner }}/reservehub:${{ github.sha }}|" \
            k8s/deployment.yaml

      - name: Commit Deployment
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/deployment.yaml

          git diff --cached --quiet || \
          git commit -m "deploy: ${{ github.sha }}"

          git push
