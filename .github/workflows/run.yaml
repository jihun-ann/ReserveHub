name: ReserveHub CI

on:
  push:
    branches:
      - sub-branch

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build and Push
    runs-on: k8s-runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Docker Login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Application Image
        run: |
          ./gradlew bootBuildImage \
            --imageName=ghcr.io/${{ github.repository_owner }}/reservehub:${{ github.sha }}

      - name: Docker Push
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/reservehub:${{ github.sha }}

      - name: Update Kubernetes Image
        run: |
          sed -i \
            "s|image: ghcr.io/.*/reservehub:.*|image: ghcr.io/${{ github.repository_owner }}/reservehub:${{ github.sha }}|" \
            k8s/deployment.yaml

      - name: Commit Deployment
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/deployment.yaml

          git diff --cached --quiet || \
          git commit -m "deploy: ${{ github.sha }}"

          git push